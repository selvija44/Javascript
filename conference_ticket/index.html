<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Conference ticket generator</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>
  <!-- <img src="./assets/images/pattern-squiggly-line-bottom-desktop.svg" alt=""> -->
    <div class="bodyele">
         <div class="heading">
    <img src="./assets/images/logo-full.svg" alt="">
    
  </div>
  <div class="heading2">
    <pre id="pre">Your Journey to Coding Conf 
  2025 Starts Here!</prepre>
    <p id="p1">Secure your spot at next year's biggest coding conference.</p>
  </div>

 <div class="form">
    <div class="upload">
      <h4>Upload Avatar</h4>
      <div class="boxfile">
         <img src="./assets/images/icon-upload.svg" alt="upload image" id="upimg">
      <p id="idp"> Drag and drop or click to upload</p>
      <input type="file" name="file" id="file">
      </div>
    </div>
    <p>&#9432;  Upload your photo (JPG or PNG, max size: 500KB).</p>

    <div class="neg">
      <label for="fullname">Full Name</label><span id="errorname"></span><br>
      <input type="text" name="text" id="text"><br>
     

      <label for="email">Email Address</label><span id="erroremail"></span><br>
      <input type="email" name="email" id="email" placeholder="example@email.com"><br>
    

      <label for="github">Github username</label> <span id="errorgh"></span><br>
      <input type="text" name="github" id="github" placeholder="@yourusername"><br>
     

    </div>

 

  <button id="btn" type="submit">Generate My Ticket</button>

 </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
