<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop your Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Shopping Page</h1>
        <p>Cart</p>
    </header>
    
    <div class="container">

    <div class="productslist">
        <div class="item item1">
            <img src="./images/download (5).jpg" alt="Laptop">
            <p class="title">Laptop</p>
            <p class="price">$3000</p>
            <button class="btn">Add to Cart</button>
        </div>
        <div class="item item2">
            <img src="./images/headphone.jpg" alt="Headphone">
            <p class="title">Headphone</p>
            <p class="price">$100</p>
            <button class="btn">Add to Cart</button>
        </div>
        <div class="item item3">
             <img src="./images/smartwatch.jpg" alt="smartwatch">
            <p class="title">Smartwatch</p>
            <p class="price">$500</p>
            <button class="btn">Add to Cart</button>
        </div>
    </div>

    <div class="cart">
        <h3>Your Cart</h3>
        <p>Total 0</p>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
